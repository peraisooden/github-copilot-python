<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty">Difficulty:</label>
    <select id="difficulty">
      <option value="40">Easy (40 clues)</option>
      <option value="35" selected>Medium (35 clues)</option>
      <option value="30">Hard (30 clues)</option>
    </select>
    <button id="new-game">New Game</button>
    <button id="hint-button">Hint</button>
    <button id="check-solution">Check Solution</button>
    <button id="toggle-theme">Dark Mode</button>
    <button id="show-leaderboard">Leaderboard</button>
    <span id="timer">00:00</span>
    <span id="message"></span>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboard-modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <h2>Top 10 Leaderboard</h2>
      <table id="leaderboard-table">
        <thead>
          <tr><th>#</th><th>Name</th><th>Time</th><th>Difficulty</th><th>Hints</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="modal-actions">
        <button id="clear-leaderboard">Clear</button>
        <button id="close-leaderboard">Close</button>
      </div>
    </div>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
